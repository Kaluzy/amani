name: Publish Amani
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AMANI_DB_PATH: ${{ github.workspace }}/.amani/pages.db
      PAGES_BASE: /amani
      PAGES_REPOSITORY: Kaluzy/amani
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit release dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium for release checks
        if: github.event_name != 'schedule'
        run: npx puppeteer browsers install chrome
      - name: Verify source changes before publishing
        if: github.event_name != 'schedule'
        run: npm test
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .amani/pages.db
          key: amani-public-v1-${{ github.run_id }}
          restore-keys: amani-public-v1-
      - run: node scripts/pages-seed.js import
        env:
          PAGES_SEED_URL: https://kaluzy.github.io/amani/data/public-seed.json
      - name: Collect fresh public data
        run: npm run refresh
      - name: Build static pages and public data
        env:
          AMANI_GA4_ID: ${{ vars.AMANI_GA4_ID }}
        run: |
          npm run build:pages
          npm run verify:dist
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .amani/pages.db
          key: amani-public-v1-${{ github.run_id }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check actual public routes and data after deployment
        env:
          AMANI_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/check-public.js
